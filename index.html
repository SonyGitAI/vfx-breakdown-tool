/* ---------- screenplay PDF parser (x-indent classification) ---------- */
const TODW=new Set(["DAY","NIGHT","LATER","CONTINUOUS","MORNING","EVENING","DUSK","DAWN","SAME",
  "MOMENTS LATER","AFTERNOON","SUNSET","SUNRISE","PRE-DAWN","MAGIC HOUR","NEXT MORNING","THAT NIGHT",
  "FLASHBACK","LATER THAT NIGHT"]);
const X_ACTION=130, X_DIALOGUE=180, X_PAREN=225, X_CHAR=300;
const SKIP_RX=/^(\(MORE\)|\(CONTINUED\)|CONTINUED:?|\d+\.?|\d+\.\s*$|\d+[A-Z]?\s+\d+[A-Z]?)$/i;
const HEAD_RX=/^(?:(\d+[A-Z]?)\s+)?(INT\.?\/EXT\.?|EXT\.?\/INT\.?|INT\.?|EXT\.?|I\/E\.?)[\s\.]/i;
const TRANS_RX=/(CUT TO|DISSOLVE TO|SMASH CUT|FADE (IN|OUT|TO)|MATCH CUT|WIPE TO)/i;
function classifyLn(x0,text){
  if(SKIP_RX.test(text.trim())) return "skip";
  if(x0>=X_CHAR) return TRANS_RX.test(text)?"transition":"skip";
  if(HEAD_RX.test(text)) return "heading";
  if(x0<X_ACTION) return (TRANS_RX.test(text)&&text.length<30)?"transition":"action";
  if(x0<X_DIALOGUE) return "dialogue";
  if(x0<X_PAREN) return "paren";
  return "character";
}
function rxq(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") }
function parseHeadingLn(text){
  text=text.trim().replace(/\.$/,"");
  let num="";
  const mn=text.match(/^(\d+[A-Z]?)\s+(.*)$/);
  if(mn && HEAD_RX.test(mn[2])){
    num=mn[1]; text=mn[2];
    text=text.replace(new RegExp("\\s+"+rxq(num)+"$"),"");   // number often repeats at line end
  }
  const m=text.match(/^(INT\.?\/EXT\.?|EXT\.?\/INT\.?|INT\.?|EXT\.?|I\/E\.?)\s*[\.\-]?\s*(.*)$/i);
  if(!m) return [num,"",text,""];
  const ie=m[1].toUpperCase().replace(/\.$/,"")+".";
  const rest=m[2].trim();
  if(rest.includes(" - ")){
    const parts=rest.split(" - ").map(p=>p.trim());
    const tail=parts[parts.length-1].toUpperCase();
    if(TODW.has(tail)||["DAY","NIGHT","LATER","CONTINUOUS"].some(w=>tail.includes(w)))
      return [num,ie,parts.slice(0,-1).join(" - "),parts[parts.length-1]];
    return [num,ie,rest,""];
  }
  const segs=rest.split(".").map(x=>x.trim()).filter(Boolean);
  if(segs.length>1 && TODW.has(segs[segs.length-1].toUpperCase()))
    return [num,ie,segs.slice(0,-1).join(". "),segs[segs.length-1]];
  return [num,ie,rest,""];
}
function buildScript(raw,title){
  // raw: [pageNo, x0, top, text] per visual line, in reading order
  const scenes=[];
  let current=null, blocks=[], pending=null, prevTop=null, prevPage=null, marginNum=null;
  const flush=()=>{ if(pending&&pending.text.trim()) blocks.push(pending); pending=null; };
  const closeScene=()=>{ flush(); if(current!==null){ current.lines=blocks; scenes.push(current); } blocks=[]; };
  const nextIsHeading=idx=>{
    for(let j=idx+1;j<Math.min(idx+3,raw.length);j++){
      const t2=raw[j][3].trim();
      const t=t2.replace(/^\d+[A-Z]?\s+/,"");
      if(HEAD_RX.test(t)||HEAD_RX.test(t2)) return true;
      return false;
    }
    return false;
  };
  raw.forEach((row,ridx)=>{
    const [pno,x0,top,text]=row;
    // left-margin printed scene number: possibly doubled ("66  66"), fused with
    // following text ("12 12 DARKNESS."), or column garbage feeding the next heading
    if(x0<70){
      const m=text.trim().match(/^(\d+[A-Z]?)\b\s*(.*)$/);
      if(m && !HEAD_RX.test(text.trim())){
        marginNum=m[1];
        let rest=m[2].replace(new RegExp("^"+rxq(marginNum)+"\\b\\s*"),"").trim();
        if(!rest) return;                       // pure number row
        if(nextIsHeading(ridx)) return;         // residue is column garbage; number feeds the heading
        rest=rest.replace(/\s+\d+[A-Z]?$/,"").trim();   // numbered beat with no slugline
        closeScene();
        current={num:marginNum, heading:rest.slice(0,60), ie:"", location:rest.slice(0,40), tod:"", page:pno};
        marginNum=null;
        return;
      }
    }
    const kind=classifyLn(x0,text);
    if(kind==="skip") return;
    const gap=(prevTop!==null && pno===prevPage && top-prevTop>20);
    prevTop=top; prevPage=pno;
    if(kind==="heading"){
      closeScene();
      const [snum,ie,loc,tod]=parseHeadingLn(text);
      current={num:snum||marginNum||String(scenes.length+1),
        heading:text.replace(/^\d+[A-Z]?\s+/,"").replace(/\s+\d+[A-Z]?$/,""),
        ie, location:loc, tod, page:pno};
      marginNum=null;
      return;
    }
    if(marginNum!==null){  // number on its own row, then a non-slugline beat
      closeScene();
      current={num:marginNum, heading:text.trim().slice(0,60), ie:"", location:text.trim().slice(0,40), tod:"", page:pno};
      marginNum=null;
    }
    if(current===null)  // pre-first-scene material (title page, FADE IN)
      current={num:1, heading:"FRONT MATTER", ie:"", location:"FRONT MATTER", tod:"", page:pno};
    if(kind==="character"){
      flush();
      const name=text.replace(/\s*\((CONT'D|CONTD|O\.S\.|V\.O\.|OS|VO|CONT\u2019D)\.?\)/gi,"").trim();
      pending={type:"dialogue", char:name, text:"", page:pno};
    } else if(kind==="paren"||kind==="dialogue"){
      if(pending&&pending.type==="dialogue") pending.text+=(pending.text?" ":"")+text;
      else { flush(); pending={type:"action", char:"", text, page:pno}; }
    } else if(kind==="transition"){
      flush(); blocks.push({type:"transition", char:"", text, page:pno});
    } else {
      if(pending&&pending.type==="action"&&!gap) pending.text+=" "+text;
      else { flush(); pending={type:"action", char:"", text, page:pno}; }
    }
  });
  closeScene();
  let item=0;
  scenes.forEach(sc=>sc.lines.forEach(ln=>{ item+=20; ln.item=item; ln.scene=sc.num; }));
  return {title, sequence:"PRJ",
    pages:raw.reduce((m,r)=>Math.max(m,r[0]),0),
    scenes, totalLines:scenes.reduce((n,sc)=>n+sc.lines.length,0)};
}
let pdfjsP=null;
function loadPdfJs(){
  // bundled copy in lib/ first (fully offline); CDN only as a fallback if lib/ is missing
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsP) return pdfjsP;
  const tryLoad=(src,worker)=>new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src=src;
    sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker; res(window.pdfjsLib); };
    sc.onerror=()=>rej(new Error("load failed: "+src));
    document.head.appendChild(sc);
  });
  pdfjsP=tryLoad("lib/pdf.min.js","lib/pdf.worker.min.js")
    .catch(()=>tryLoad("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
                       "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"))
    .catch(()=>{ pdfjsP=null;
      throw new Error("Couldn't load the PDF engine — the lib/ folder is missing and there's no internet."); });
  return pdfjsP;
}
async function extractPdfLines(file,onProgress){
  const pdfjs=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjs.getDocument({data:buf}).promise;
  const raw=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const H=page.view[3]-page.view[1];
    const rows={};
    tc.items.forEach(it=>{
      if(!it.str||!it.str.trim()) return;
      const x=it.transform[4], top=H-it.transform[5];
      const k=Math.round(top/3);
      (rows[k]=rows[k]||[]).push({x,top,str:it.str,w:it.width||0});
    });
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(k=>{
      const ws=rows[k].sort((a,b)=>a.x-b.x);
      let text="", lastEnd=null;
      ws.forEach(w=>{ if(lastEnd!==null && w.x-lastEnd>1) text+=" "; text+=w.str; lastEnd=w.x+w.w; });
      text=text.replace(/\s+/g," ").trim();
      if(text) raw.push([p, ws[0].x, ws[0].top, text]);
    });
    onProgress&&onProgress(p,pdf.numPages);
  }
  return raw;
}

/* ---------- first-run setup ---------- */
function showSetup(){
  const su=document.getElementById("setup");
  su.hidden=false;
  const drop=document.getElementById("pdfDrop"), st=document.getElementById("suStatus"),
        ti=document.getElementById("suTitle"), go=document.getElementById("suGo");
  let parsed=null;
  const takePdf=async file=>{
    if(!file) return;
    if(!/pdf$/i.test(file.name)&&file.type!=="application/pdf"){ st.textContent="That doesn't look like a PDF."; return; }
    if(!ti.value.trim())
      ti.value=file.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ").trim().toUpperCase();
    st.textContent="Reading PDF…";
    go.disabled=true; parsed=null;
    try{
      const raw=await extractPdfLines(file,(p,n)=>{ st.textContent=`Parsing… page ${p} / ${n}`; });
      parsed=buildScript(raw, ti.value.trim()||"UNTITLED");
      if(!parsed.scenes.length){ st.textContent="No scenes found — is this a formatted screenplay PDF?"; return; }
      st.innerHTML=`<b style="color:var(--green)">✓ ${parsed.scenes.length} scenes · ${parsed.pages} pages · ${parsed.totalLines} lines.</b><br>`+
        `First scenes: ${parsed.scenes.slice(0,5).map(sc=>esc(String(sc.num))+" "+esc((sc.heading||"").slice(0,26))).join(" · ")}…<br>`+
        `<span style="color:var(--dim2)">Check the numbering matches your script, then start.</span>`;
      drop.textContent="✓ "+file.name+" — drop another PDF to re-parse";
      go.disabled=false;
    }catch(err){ st.textContent="⚠ "+err.message; }
  };
  drop.onclick=()=>{ const i=document.createElement("input"); i.type="file"; i.accept=".pdf,application/pdf";
    i.onchange=()=>takePdf(i.files[0]); i.click(); };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");takePdf(e.dataTransfer.files[0])};
  go.onclick=()=>{
    if(!parsed) return;
    parsed.title=ti.value.trim().toUpperCase()||parsed.title;
    try{ localStorage.setItem(SCRIPT_KEY, JSON.stringify(parsed)); }
    catch(e){ st.textContent="⚠ Browser storage is full or blocked — couldn't save the script."; return; }
    location.reload();
  };
  document.getElementById("suImport").onclick=()=>{
    const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange=()=>{
      const f=new FileReader();
      f.onload=()=>{
        let obj; try{ obj=JSON.parse(f.result) }catch(e){ st.textContent="That file isn't valid JSON."; return; }
        if(obj&&obj.script&&obj.state){
          try{
            localStorage.setItem(SCRIPT_KEY, JSON.stringify(obj.script));
            localStorage.setItem("vfxsb:state:"+obj.script.title, JSON.stringify(obj.state));
          }catch(e){ st.textContent="⚠ Storage full — couldn't restore."; return; }
          location.reload();
        } else st.textContent="That backup doesn't include the script — export a fresh session backup from the tool and use that.";
      };
      f.readAsText(i.files[0]);
    };
    i.click();
  };
}

/* ---------- boot ---------- */
function bootApp(){
  filmTitle.textContent=DATA.title;
  filmSub.textContent=(DATA.version?"draft "+DATA.version+" · ":"")+DATA.scenes.length+" scenes · "+DATA.pages+" pages";
  renderAll();
}
search.oninput=()=>{query=search.value.trim();curMatch=0;renderScript();refreshSel();markCur()};
search.onkeydown=e=>{
  if(e.key==="Enter"){ e.preventDefault(); goMatch(e.shiftKey?-1:1) }
  else if(e.key==="Escape"){ search.value=""; query=""; renderScript(); refreshSel(); markCur(); search.blur() }
};
document.getElementById("srchNext").onclick=()=>goMatch(1);
document.getElementById("srchPrev").onclick=()=>goMatch(-1);
document.getElementById("filter").onchange=e=>{filter=e.target.value;curMatch=0;renderScript();refreshSel();markCur();renderStrip()};
document.getElementById("btnStripFilter").onclick=()=>{stripFilter=!stripFilter;renderStrip();
  toast(stripFilter?"Scene list follows the filters":"Scene list shows all scenes")};
const ef=document.getElementById("elFilter");
function fillElFilter(){
  const u=elUsage(), keep=ef.value;
  const groups={};
  S.lib.forEach(e=>{ if(u[e.name]) (groups[e.cat]=groups[e.cat]||[]).push(e) });
  let html=`<option value="">Filter by element…</option>`;
  Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(c=>{
    const els=groups[c].sort((a,b)=>a.name.localeCompare(b.name));
    const tot=els.reduce((s,e)=>s+u[e.name].n,0);
    html+=`<optgroup label="${esc(c)}">`
       +`<option value="cat:${esc(c)}">All ${esc(c)} · ${tot} shot${tot===1?"":"s"}</option>`
       +els.map(e=>`<option value="${esc(e.name)}">&nbsp;&nbsp;${esc(e.name)} · ${u[e.name].n}</option>`).join("")
       +`</optgroup>`;
  });
  ef.innerHTML=html;
  ef.value=[...ef.options].some(o=>o.value===keep)?keep:"";
}
ef.onmousedown=fillElFilter;
ef.onchange=()=>{ elFilter=ef.value; renderScript(); refreshSel(); renderStrip() };
btnExp.onclick=openExport;
btnStrip.onclick=()=>strip.classList.toggle("min");
const THEME_KEY="vfxbd:theme";
function applyTheme(t){document.body.classList.toggle("light",t==="light");btnTheme.textContent=t==="light"?"🌙":"☀︎"}
let theme=lsGet(THEME_KEY)||"light";
applyTheme(theme);
btnTheme.onclick=()=>{theme=theme==="light"?"dark":"light";lsSet(THEME_KEY,theme);applyTheme(theme)};
if(DATA){ initState(); bootApp(); }
else showSetup();
